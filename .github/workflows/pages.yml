name: BrainQuiz Studio — Test & Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and regression tests
        run: |
          npm run check:syntax
          npm test
      - name: No private quiz files, passwords or Windows packages in repository
        shell: bash
        run: |
          ! find . -type f \( -name '*.brainquiz.json' -o -name '*.brainplay.json' -o -name '*.exe' -o -name '*.bat' -o -name '*service-account*.json' -o -name '.env' -o -name '.env.*' \) | grep .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone PeerJS shell
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
