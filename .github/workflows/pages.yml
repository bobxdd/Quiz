name: BrainQuiz Studio — Test & Publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and regression tests
        run: |
          npm run check:syntax
          npm test
      - name: Chromium browser checks for local quizboard recovery and mobile UI
        run: |
          python -m compileall -q tests
          python -m pip install --disable-pip-version-check playwright==1.65.0
          failed=0
          # Run the newest visual-UX guard first so a viewport regression fails
          # promptly rather than after the entire legacy browser suite.
          timeout -k 10s 120s python tests/visual-answer-usability-browser.py
          timeout -k 10s 120s python tests/board-workspace-browser.py || failed=1
          timeout -k 10s 120s python tests/written-deadline-fairness-browser.py || failed=1
          timeout -k 10s 120s python tests/map-step3-browser.py || failed=1
          timeout -k 10s 120s python tests/publish-lock-lobby-exit-browser.py || failed=1
          timeout -k 10s 120s python tests/saved-quiz-host-lobby-browser.py || failed=1
          timeout -k 10s 120s python tests/host-flow-clarity-browser.py || failed=1
          timeout -k 10s 120s python tests/map-step3-peer-browser.py || failed=1
          timeout -k 10s 120s python tests/map-distance-browser.py || failed=1
          timeout -k 10s 120s python tests/original-arm-browser.py || failed=1
          timeout -k 10s 120s python tests/uncovered-ui-audit-browser.py || failed=1
          timeout -k 10s 120s python tests/features-3_4-browser.py || failed=1
          timeout -k 10s 120s python tests/team-lobby-step4-browser.py || failed=1
          timeout -k 10s 120s python tests/ui-step3-layout-browser.py || failed=1
          timeout -k 10s 120s python tests/step5-characters-browser.py || failed=1
          timeout -k 10s 120s python tests/step6-question-cover-browser.py || failed=1
          timeout -k 10s 120s python tests/soundquiz-browser.py || failed=1
          timeout -k 10s 120s python tests/sound-effects-browser.py || failed=1
          timeout -k 10s 120s python tests/buzzer-auto-reveal-browser.py || failed=1
          timeout -k 10s 120s python tests/answer-tab-browser.py || failed=1
          timeout -k 10s 120s python tests/team-emoji-browser.py || failed=1
          timeout -k 10s 120s python tests/board-rounds-browser.py || failed=1
          timeout -k 10s 120s python tests/team-turns-browser.py || failed=1
          timeout -k 10s 120s python tests/one-screen-reveal-browser.py || failed=1
          timeout -k 10s 120s python tests/connection-recovery-browser.py || failed=1
          timeout -k 10s 120s python tests/finale-score-browser.py || failed=1
          timeout -k 10s 120s python tests/recovery-projector-browser.py || failed=1
          timeout -k 10s 120s python tests/editor-qol-audit-browser.py || failed=1
          timeout -k 10s 120s python tests/large-media-browser.py || failed=1
          timeout -k 10s 120s python tests/map-buzzer-review-browser.py || failed=1
          timeout -k 10s 120s python tests/editor-3_1-browser.py || failed=1
          timeout -k 10s 120s python tests/image-drop-browser.py || failed=1
          timeout -k 10s 120s python tests/categories-3_0-browser.py || failed=1
          exit "$failed"
      - name: Preserve layout screenshots and measurements for review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brainquiz-layout-audit
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: No private quiz files, passwords or Windows packages in repository
        shell: bash
        run: |
          ! find . -type f \( -name '*.brainquiz.json' -o -name '*.brainplay.json' -o -name '*.exe' -o -name '*.bat' -o -name '*service-account*.json' -o -name '.env' -o -name '.env.*' \) | grep .
  crossbrowser:
    runs-on: ubuntu-24.04
    # The official Playwright image has both browser engines and their OS
    # dependencies pre-installed. Avoid apt's multi-GB package downloads on
    # rolling Ubuntu runners, which previously hung this job for 23 minutes.
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Firefox and WebKit recovery and projector checks
        run: |
          python -m pip install --disable-pip-version-check playwright==1.65.0
          # Playwright's Firefox sandbox requires HOME to be owned by root;
          # GitHub Actions otherwise sets /github/home owned by pwuser.
          export HOME=/root
          timeout -k 10s 150s env BRAINQUIZ_BROWSER=firefox python tests/recovery-projector-browser.py
          timeout -k 10s 150s env BRAINQUIZ_BROWSER=webkit python tests/recovery-projector-browser.py
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [check, crossbrowser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone PeerJS shell
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      # Artifact names must be unique across rerun attempts of the same workflow run.
      # Otherwise deploy-pages sees duplicate "github-pages" artifacts and hard-fails.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify published app and projector files
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGES_URL"
          published="$(mktemp)"
          trap 'rm -f "$published"' EXIT
          for asset in app.mjs sound-effects.mjs team-emoji.mjs emoji-catalog.json session-ui.css studio-editor.mjs projector.html sw.js; do
            verified=false
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 10 "${PAGES_URL%/}/$asset?release=$GITHUB_SHA-$attempt" -o "$published" && cmp -s "docs/$asset" "$published"; then
                echo "Verified $asset for $GITHUB_SHA"
                verified=true
                break
              fi
              sleep 5
            done
            "$verified" || exit 1
          done
