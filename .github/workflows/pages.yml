name: BrainQuiz Studio — Test & Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and regression tests
        run: |
          npm run check:syntax
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chromium browser checks for local quizboard recovery and mobile UI
        run: |
          python -m pip install --disable-pip-version-check playwright==1.65.2
          python -m playwright install --with-deps chromium
          python tests/board-workspace-browser.py
          python tests/map-step3-browser.py
          python tests/editor-3_1-browser.py
          python tests/categories-3_0-browser.py
      - name: No private quiz files, passwords or Windows packages in repository
        shell: bash
        run: |
          ! find . -type f \( -name '*.brainquiz.json' -o -name '*.brainplay.json' -o -name '*.exe' -o -name '*.bat' -o -name '*service-account*.json' -o -name '.env' -o -name '.env.*' \) | grep .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone PeerJS shell
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
