name: BrainQuiz Studio — Test & Publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and regression tests
        run: |
          npm run check:syntax
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chromium browser checks for local quizboard recovery and mobile UI
        run: |
          python -m compileall -q tests
          python -m pip install --disable-pip-version-check playwright==1.65.2
          python -m playwright install --with-deps chromium
          python tests/board-workspace-browser.py
          python tests/map-step3-browser.py
          python tests/publish-lock-lobby-exit-browser.py
          python tests/saved-quiz-host-lobby-browser.py
          python tests/host-flow-clarity-browser.py
          python tests/map-step3-peer-browser.py
          python tests/map-distance-browser.py
          python tests/original-arm-browser.py
          python tests/uncovered-ui-audit-browser.py
          python tests/features-3_4-browser.py
          python tests/team-lobby-step4-browser.py
          python tests/ui-step3-layout-browser.py
          python tests/step5-characters-browser.py
          python tests/step6-question-cover-browser.py
          python tests/soundquiz-browser.py
          python tests/sound-effects-browser.py
          python tests/buzzer-auto-reveal-browser.py
          python tests/answer-tab-browser.py
          python tests/team-emoji-browser.py
          python tests/board-rounds-browser.py
          python tests/finale-score-browser.py
          python tests/recovery-projector-browser.py
          python tests/editor-qol-audit-browser.py
          python tests/large-media-browser.py
          python tests/map-buzzer-review-browser.py
          python tests/editor-3_1-browser.py
          python tests/image-drop-browser.py
          python tests/categories-3_0-browser.py
      - name: Firefox and WebKit recovery and projector checks
        run: |
          python -m playwright install --with-deps firefox webkit
          BRAINQUIZ_BROWSER=firefox python tests/recovery-projector-browser.py
          BRAINQUIZ_BROWSER=webkit python tests/recovery-projector-browser.py
      - name: Preserve layout screenshots and measurements for review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brainquiz-layout-audit
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: No private quiz files, passwords or Windows packages in repository
        shell: bash
        run: |
          ! find . -type f \( -name '*.brainquiz.json' -o -name '*.brainplay.json' -o -name '*.exe' -o -name '*.bat' -o -name '*service-account*.json' -o -name '.env' -o -name '.env.*' \) | grep .
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone PeerJS shell
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      # Artifact names must be unique across rerun attempts of the same workflow run.
      # Otherwise deploy-pages sees duplicate "github-pages" artifacts and hard-fails.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify published app and projector files
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGES_URL"
          published="$(mktemp)"
          trap 'rm -f "$published"' EXIT
          for asset in app.mjs team-emoji.mjs projector.html sw.js; do
            verified=false
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 10 "${PAGES_URL%/}/$asset?release=$GITHUB_SHA-$attempt" -o "$published" && cmp -s "docs/$asset" "$published"; then
                echo "Verified $asset for $GITHUB_SHA"
                verified=true
                break
              fi
              sleep 5
            done
            "$verified" || exit 1
          done
